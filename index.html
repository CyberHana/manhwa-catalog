<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhwa Katalogi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #18191c;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
        }
        h2 { margin: 0 0 12px 0; font-size: 22px; }
        .search-box {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            background: #26282c;
            color: white;
            font-size: 15px;
            margin-bottom: 14px;
            outline: none;
        }
        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
        }
        .tab {
            background: #26282c;
            color: #b0b3b8;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .tab.active {
            background: #2ea47f;
            color: #ffffff;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .card {
            background: #222428;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .card:active { transform: scale(0.96); }
        .card img {
            width: 100%;
            height: 145px;
            object-fit: cover;
        }
        .card-info { padding: 8px; }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            margin: 0 0 4px 0;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
        }
        .card-status {
            font-size: 11px;
            color: #2ea47f;
        }
    </style>
</head>
<body>

    <h2 id="catalog-title">Inglizcha manhwalar</h2>
    <input type="text" class="search-box" id="searchInput" placeholder="🔍 Nomini yozing..." oninput="renderCards()">

    <div class="tabs">
        <button class="tab active" onclick="setLang('en', 'Inglizcha manhwalar', this)">🇺🇸 Inglizcha</button>
        <button class="tab" onclick="setLang('ko', 'Koreyscha manhwalar', this)">🇰🇷 Koreyscha</button>
        <button class="tab" onclick="setLang('ru', 'Ruscha manhwalar', this)">🇷🇺 Ruscha</button>
        <button class="tab" onclick="setLang('zh', 'Xitoycha (Manhua)', this)">🇨🇳 Xitoycha</button>
        <button class="tab" onclick="setLang('ja', 'Yaponcha (Manga)', this)">🇯🇵 Yaponcha</button>
    </div>

    <div class="grid" id="manhwaGrid"></div>

    <script>
        const tg = (window.Telegram && window.Telegram.WebApp) || null;
        if (tg) tg.expand();

        let currentLang = 'en';

        // Tashqi placeholder xizmatiga bog'liq bo'lmagan rasm (SVG)
        function cover(color, text) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="150" height="200">` +
                `<rect width="100%" height="100%" fill="${color}"/>` +
                `<text x="50%" y="50%" fill="#fff" font-family="Arial" font-size="16" ` +
                `text-anchor="middle" dominant-baseline="middle">${text}</text></svg>`;
            return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
        }

        // Namuna ma'lumotlar bazasi (keyinchalik API yoki JSON ga ulashingiz mumkin)
        const catalogData = [
            { lang: 'en', title: 'Solo Leveling', status: 'Tugallangan', img: cover('#2ea47f', 'Solo Leveling') },
            { lang: 'en', title: 'The Greatest Estate Developer', status: 'Davom etmoqda', img: cover('#3b82f6', 'Estate Dev') },
            { lang: 'ko', title: '나 혼자만 레벨업 (Solo Leveling)', status: 'Koreyscha RAW', img: cover('#ef4444', 'KR RAW') },
            { lang: 'ko', title: '전지적 독자 시점 (Omniscient Reader)', status: 'Koreyscha RAW', img: cover('#8b5cf6', 'ORV KR') },
            { lang: 'ru', title: 'Поднятие уровня в одиночку', status: 'Ruscha tarjima', img: cover('#f59e0b', 'RU Manhwa') },
            { lang: 'ja', title: 'ワンピース (One Piece)', status: 'Yaponcha RAW', img: cover('#0ea5e9', 'JP Manga') },
            { lang: 'zh', title: 'Magic Emperor (魔皇大管家)', status: 'Xitoycha RAW', img: cover('#10b981', 'CN Manhua') }
        ];

        function setLang(lang, title, btn) {
            currentLang = lang;
            document.getElementById('catalog-title').innerText = title;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            renderCards();
        }

        function renderCards() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('manhwaGrid');
            grid.innerHTML = '';

            const filtered = catalogData.filter(item => 
                item.lang === currentLang && item.title.toLowerCase().includes(query)
            );

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                const img = document.createElement('img');
                img.src = item.img;
                img.alt = item.title;
                const info = document.createElement('div');
                info.className = 'card-info';
                const t = document.createElement('div');
                t.className = 'card-title';
                t.textContent = item.title;
                const st = document.createElement('div');
                st.className = 'card-status';
                st.textContent = '● ' + item.status;
                info.append(t, st);
                card.append(img, info);
                card.onclick = () => {
                    const payload = JSON.stringify({ action: "select_manhwa", title: item.title, lang: item.lang });
                    if (tg) { tg.sendData(payload); } else { alert('Bu sahifa faqat Telegram ichida ishlaydi.'); }
                };
                grid.appendChild(card);
            });
        }

        renderCards();
    </script>
</body>
</html>
